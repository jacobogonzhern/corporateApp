<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home"></ion-back-button></ion-buttons>
    <ion-title>Nosotros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header><ion-card-title>Nuestra empresa</ion-card-title></ion-card-header>
    <ion-card-content>
      Empresa especializada en soluciones basadas en Angular, Ionic y Node.js.
      <p>Oficinas: Calle Arcos de Jalón 18, Madrid</p>
      @if (distancia() !== null) {
        <p>Distancia a nuestras oficinas: {{ distancia() | number:'1.0-2' }} km</p>
      }
      @if (error()) {
        <p>{{ error() }}</p>
      }
    </ion-card-content>
  </ion-card>
</ion-content>
